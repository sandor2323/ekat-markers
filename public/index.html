<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e10">
  <title>Карта Екатеринбурга — метки</title>
  <meta name="description" content="Карта Екатеринбурга с метками. Поставьте метку правой кнопкой мыши: она будет видна всем и проживёт 2 часа.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23ff3333'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <!-- Экран загрузки с полицейскими мигалками -->
  <div id="splash">
    <div class="sirens">
      <div class="siren siren-blue"></div>
      <div class="siren siren-red"></div>
    </div>
    <div id="splash-hello" class="splash-hello hidden"></div>
  </div>

  <div id="map"></div>

  <!-- Окно входа -->
  <div id="login" class="login hidden">
    <form id="login-form" class="login-box" autocomplete="off">
      <div class="login-tabs">
        <button type="button" id="tab-login" class="login-tab active">Вход</button>
        <button type="button" id="tab-reg" class="login-tab">Регистрация</button>
      </div>
      <div id="login-title" class="login-title">Вход</div>
      <input id="login-name" class="login-input" type="text" placeholder="Никнейм" maxlength="30" autocomplete="username">
      <input id="login-pass" class="login-input" type="password" placeholder="Пароль" autocomplete="current-password">
      <div id="login-error" class="login-error"></div>
      <div id="login-success" class="login-success hidden">Успешно</div>
      <label class="login-remember">
        <input type="checkbox" id="remember-box" checked>
        Запомнить меня
      </label>
      <div class="login-btns">
        <button type="submit" id="login-btn" class="btn btn-yes">Войти</button>
      </div>
    </form>
  </div>

  <!-- Диалог «Поставить метку?» -->
  <div id="ask-box" class="ask-box hidden">
    <div class="ask-question">Поставить метку?</div>
    <div class="ask-actions">
      <button id="ask-yes" class="btn btn-yes">Да</button>
      <button id="ask-no" class="btn btn-no">Нет</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
